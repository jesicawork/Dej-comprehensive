<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>大洋周文理補習班｜綜合資料庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --lavender-bg:#EEE7F8;
    --lavender-deep:#9B7FC7;
    --lavender-line:#D9CBEF;
    --purple-bg:#F1EAFB;
    --purple-deep:#6B3FA0;
    --ink:#453659;
    --ink-soft:#7A6C93;
    --paper:#FFFFFF;
    --danger:#D9695F;
    --shadow: 0 8px 24px rgba(90,66,130,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Noto Sans TC",sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(107,63,160,0.16), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(155,127,199,0.18), transparent 45%),
      var(--lavender-bg);
    color:var(--ink);
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:"Noto Serif TC",serif;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--purple-deep);color:#fff;}

  .app{ display:flex; min-height:100vh; max-width:1280px; margin:0 auto; }

  /* ---------- Folder-tab side nav ---------- */
  .tabnav{ width:112px; flex-shrink:0; padding:38px 0 20px 18px; display:flex; flex-direction:column; gap:14px; }
  .tabnav .brandmark{
    writing-mode:vertical-rl; font-family:"Noto Serif TC",serif; font-weight:900; font-size:13px;
    letter-spacing:4px; color:var(--purple-deep); margin-bottom:10px; padding-left:4px;
  }
  .tab-btn{
    position:relative; border:none; text-align:left; padding:16px 10px 16px 16px;
    border-radius:14px 4px 4px 14px; font-size:14px; font-weight:700; color:var(--ink-soft);
    background:rgba(255,255,255,0.55); box-shadow:0 2px 6px rgba(90,66,130,0.08);
    transform:translateX(0) rotate(-0.4deg);
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
    line-height:1.5;
  }
  .tab-btn .en{ display:block; font-size:9px; letter-spacing:1.5px; font-weight:500; color:var(--ink-soft); opacity:.7; margin-top:2px; }
  .tab-btn:nth-child(2){ background:var(--purple-bg); }
  .tab-btn:nth-child(3){ background:var(--lavender-bg); }
  .tab-btn:nth-child(4){ background:var(--purple-bg); }
  .tab-btn:hover{ transform:translateX(6px) rotate(-0.4deg); }
  .tab-btn.active{
    background:var(--paper); color:var(--ink); transform:translateX(14px) rotate(0deg);
    box-shadow:var(--shadow); z-index:2;
  }
  .tab-btn.active::after{ content:""; position:absolute; right:-14px; top:0; bottom:0; width:14px; background:var(--paper); }

  /* ---------- Main paper card ---------- */
  .main-wrap{ flex:1; padding:32px 32px 32px 0; min-width:0; }
  .paper-card{
    position:relative; background:var(--paper); border-radius:6px 22px 22px 22px;
    box-shadow:var(--shadow); min-height:calc(100vh - 64px); padding:36px 40px; overflow:hidden;
  }
  .paper-card::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:26px;
    background-image: radial-gradient(circle, var(--lavender-bg) 5px, transparent 5.5px);
    background-size: 26px 34px; background-position: 9px 20px; opacity:.9;
  }
  .paper-card > .content{ margin-left:14px; animation: fadein .35s ease; }
  @keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ .paper-card > .content{ animation:none; } .tab-btn{ transition:none; } }

  .topbar{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22px; gap:16px; }
  .eyebrow{ font-size:12px; letter-spacing:3px; color:var(--purple-deep); font-weight:700; margin:0 0 6px; }
  .page-title{ font-size:28px; margin:0; color:var(--ink); font-weight:900; }
  .icon-btn{
    border:1px solid var(--lavender-line); background:var(--lavender-bg); color:var(--ink);
    width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:16px; flex-shrink:0;
  }
  .icon-btn:hover{ background:var(--purple-bg); }

  /* ---------- Home hero ---------- */
  .hero{
    background:linear-gradient(135deg, var(--lavender-bg), var(--purple-bg) 55%, var(--paper) 100%);
    border:1px solid var(--lavender-line); border-radius:20px; padding:34px 36px; margin-bottom:26px;
  }
  .hero h1{ font-size:34px; margin:0 0 6px; color:var(--ink); }
  .hero p{ margin:0; color:var(--ink-soft); font-size:15px; }
  .stat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin:26px 0; max-width:760px; }
  .stat-card{ background:var(--paper); border:1px solid var(--lavender-line); border-radius:16px; padding:18px 20px; position:relative; }
  .stat-card::before{
    content:""; position:absolute; top:-6px; left:20px; width:34px; height:12px;
    background:linear-gradient(90deg, var(--lavender-deep), var(--purple-deep)); opacity:.75; border-radius:2px; transform:rotate(-3deg);
  }
  .stat-num{ font-family:"Noto Serif TC",serif; font-size:30px; font-weight:900; color:var(--purple-deep); }
  .stat-label{ font-size:13px; color:var(--ink-soft); margin-top:2px; }

  .nav-cards{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
  @media (max-width: 900px){ .nav-cards{ grid-template-columns:1fr; } }
  .nav-card{
    border:1px solid var(--lavender-line); border-radius:16px; padding:22px 20px; background:var(--lavender-bg);
    transition:transform .15s ease, box-shadow .15s ease; text-align:left;
  }
  .nav-card:hover{ transform:translateY(-3px); box-shadow:var(--shadow); }
  .nav-card h3{ margin:8px 0 4px; font-size:17px; }
  .nav-card p{ margin:0; font-size:13px; color:var(--ink-soft); line-height:1.6; }
  .nav-card .badge{ display:inline-block; font-size:22px; }

  /* ---------- Lock screen ---------- */
  .lock-screen{ display:flex; justify-content:center; padding:40px 14px; }
  .lock-card{
    width:100%; max-width:320px; text-align:center; background:var(--paper);
    border:1.5px solid var(--lavender-line); border-radius:18px; padding:32px 24px; box-shadow:var(--shadow);
  }
  .lock-icon{ font-size:34px; margin-bottom:8px; }
  .lock-card h3{ margin:0 0 6px; font-size:17px; }
  .lock-card .sub{ font-size:12px; color:var(--ink-soft); margin-bottom:16px; }
  .lock-card input[type=password]{
    width:100%; padding:11px 14px; border-radius:10px; border:1.5px solid var(--lavender-line);
    font-size:16px; text-align:center; letter-spacing:3px; background:var(--lavender-bg); color:var(--ink);
  }
  .lock-error{ color:var(--danger); font-size:12px; margin-top:8px; height:16px; visibility:hidden; }
  .lock-error.show{ visibility:visible; }
  .btn{
    border:none; border-radius:10px; padding:9px 16px; font-size:13px; font-weight:700;
    background:linear-gradient(90deg, var(--lavender-deep), var(--purple-deep)); color:#fff;
  }
  .btn:hover{ opacity:.92; }
  .btn.ghost{ background:var(--lavender-bg); color:var(--ink); }
  .btn.small{ padding:6px 12px; font-size:12px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  /* ---------- Hub diagram ---------- */
  .hub-wrap{ margin:8px 0 30px; }
  .hub-wrap svg{ width:100%; height:auto; display:block; }
  .hub-caption{ text-align:center; font-size:13px; color:var(--ink-soft); margin-top:8px; }

  /* ---------- section label ---------- */
  .section-label{
    display:inline-block; font-family:"Noto Serif TC",serif; font-weight:900; font-size:14px;
    letter-spacing:2px; color:#fff; background:linear-gradient(90deg, var(--lavender-deep), var(--purple-deep));
    padding:6px 16px; border-radius:8px; margin-bottom:14px;
  }

  /* ---------- DB cards ---------- */
  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-bottom:34px; }
  @media (max-width: 820px){ .grid{ grid-template-columns:1fr; } }
  .db-card{
    text-align:left; background:var(--paper); border:1.5px solid var(--lavender-line); border-radius:16px;
    padding:20px 20px; display:flex; flex-direction:column; gap:10px; text-decoration:none; color:var(--ink);
    transition:transform .15s ease, box-shadow .15s ease; position:relative; overflow:hidden;
  }
  .db-card:not(.disabled):hover{ transform:translateY(-3px); box-shadow:var(--shadow); border-color:var(--purple-deep); }
  .db-card .bar{ position:absolute; left:0; top:0; bottom:0; width:5px; }
  .db-card.el .bar{ background:var(--lavender-deep); }
  .db-card.mid .bar{ background:#C7BBDD; }
  .db-card.hi .bar{ background:var(--purple-deep); }
  .db-card .tag{
    font-size:10px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase;
    padding:3px 10px; border-radius:99px; width:fit-content;
  }
  .db-card.el .tag{ background:var(--lavender-bg); color:var(--lavender-deep); }
  .db-card.mid .tag{ background:#F1EEF7; color:#8B7CA6; }
  .db-card.hi .tag{ background:var(--purple-bg); color:var(--purple-deep); }
  .db-card h3{ margin:0; font-size:19px; }
  .db-card p{ margin:0; font-size:13px; color:var(--ink-soft); line-height:1.6; flex:1; }
  .db-card .enter{ margin-top:2px; font-size:13px; font-weight:700; color:var(--purple-deep); }
  .db-card.disabled{ opacity:.7; border-style:dashed; cursor:default; }
  .db-card.disabled:hover{ transform:none; box-shadow:none; }

  .status-badge{ flex-shrink:0; font-size:10px; font-weight:800; padding:2px 9px; border-radius:99px; width:fit-content; }
  .status-badge.on{ background:#DCEFE2; color:#3D8461; }
  .status-badge.off{ background:#F1EEF7; color:#8B7CA6; }

  .roadmap{ border-top:1.5px dashed var(--lavender-line); padding-top:22px; }
  .roadmap h3{ font-family:"Noto Serif TC",serif; font-size:15px; margin:0 0 14px; }
  .steps{ list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:8px; }
  .steps li{
    font-size:12px; padding:7px 12px; border-radius:99px; border:1px solid var(--lavender-line);
    color:var(--ink-soft); background:var(--lavender-bg);
  }
  .steps li.done{ color:#3D8461; border-color:#DCEFE2; background:#DCEFE2; }
  .steps li.now{ color:#fff; border-color:transparent; background:linear-gradient(90deg, var(--lavender-deep), var(--purple-deep)); font-weight:700; }

  .helper-note{ font-size:12px; color:var(--ink-soft); background:var(--lavender-bg); border-radius:10px; padding:10px 14px; margin-top:16px; line-height:1.6; }

  /* ---------- teacher directory ---------- */
  .toolbar{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
  .toolbar input[type=text]{
    flex:1; min-width:160px; padding:9px 12px; border-radius:10px; border:1px solid var(--lavender-line);
    font-size:13px; background:var(--lavender-bg);
  }
  .toolbar select{
    padding:9px 12px; border-radius:10px; border:1px solid var(--lavender-line); background:var(--lavender-bg); font-size:13px; color:var(--ink);
  }
  .teacher-card-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:14px; }
  .teacher-card{
    text-align:left; background:var(--paper); border:1.5px solid var(--lavender-line); border-radius:14px;
    padding:16px 18px; display:flex; flex-direction:column; gap:6px; cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .teacher-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow); border-color:var(--purple-deep); }
  .teacher-card .tc-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .teacher-card .tc-name{ font-weight:700; font-size:16px; }
  .teacher-card .tc-meta{ font-size:12.5px; color:var(--ink-soft); }
  .teacher-card .tc-phone{ font-size:12.5px; color:var(--ink); }
  .tier-chip{
    display:inline-block; font-size:10px; font-weight:700; padding:2px 9px; border-radius:99px; margin:2px 4px 0 0;
  }
  .tier-chip.el{ background:var(--lavender-bg); color:var(--lavender-deep); }
  .tier-chip.mid{ background:#F1EEF7; color:#8B7CA6; }
  .tier-chip.hi{ background:var(--purple-bg); color:var(--purple-deep); }
  .tier-chip.sub{ background:#FCEFE3; color:#B4562C; }
  .empty-state{ text-align:center; padding:50px 20px; color:var(--ink-soft); }
  .empty-state .ic{ font-size:38px; display:block; margin-bottom:10px; }

  /* ---------- Modal ---------- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(69,54,89,0.35); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal{ background:var(--paper); border-radius:18px; padding:26px 28px; width:100%; max-width:460px; box-shadow:var(--shadow); max-height:88vh; overflow-y:auto; }
  .modal h3{ margin:0 0 4px; font-size:18px; }
  .modal .sub{ font-size:12px; color:var(--ink-soft); margin-bottom:16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:5px; }
  .field input[type=text], .field input[type=tel], .field input[type=email], .field input[type=date], .field input[type=url], .field select{
    width:100%; padding:9px 12px; border-radius:10px; border:1px solid var(--lavender-line);
    font-size:14px; background:var(--lavender-bg); color:var(--ink);
  }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:18px; flex-wrap:wrap; }
  .checkbox-group{ display:flex; flex-wrap:wrap; gap:10px 16px; background:var(--lavender-bg); border-radius:10px; padding:12px 14px; }
  .checkbox-group label{ font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px; }

  #toast-wrap{ position:fixed; bottom:22px; right:22px; display:flex; flex-direction:column; gap:8px; z-index:99; }

  @media (max-width:860px){
    .app{ flex-direction:column; }
    .tabnav{ flex-direction:row; padding:16px; width:100%; overflow-x:auto; }
    .tabnav .brandmark{ display:none; }
    .tab-btn{ transform:none !important; white-space:nowrap; }
    .main-wrap{ padding:0 14px 24px; }
    .stat-row, .nav-cards{ grid-template-columns:1fr; }
  }
  @media (max-width:520px){
    body{ font-size:15px; }
    .paper-card{ padding:18px 14px; border-radius:16px; }
    .page-title{ font-size:20px; }
    .field-row{ flex-direction:column; gap:0; }
    .modal{ padding:20px 18px; border-radius:16px; max-height:92vh; }
    .modal-overlay{ padding:12px; align-items:flex-end; }
    .modal-actions{ flex-wrap:wrap; }
    .modal-actions .btn{ flex:1; min-width:100px; }
  }
</style>
</head>
<body>
<div id="app" class="app">
  <nav class="tabnav">
    <span class="brandmark">大洋周文理補習班</span>
    <button class="tab-btn" data-view="home">首頁<span class="en">HOME</span></button>
    <button class="tab-btn" data-view="hub">入口導覽<span class="en">ENTRY</span></button>
    <button class="tab-btn" data-view="teachers">教師檔案<span class="en">STAFF</span></button>
    <button class="tab-btn" data-view="dashboard">跨年齡層儀表板<span class="en">DASHBOARD</span></button>
  </nav>
  <div class="main-wrap">
    <div class="paper-card">
      <div class="content" id="content"><!-- rendered by JS --></div>
    </div>
  </div>
</div>
<div id="modal-root"></div>
<div id="toast-wrap"></div>

<script>
/* ============ backend: local (this browser) or cloud (Google Apps Script) ============ */
const LOCAL_PREFIX = 'dyzw_hub_';
const GAS_URL_KEY = 'dyzw_hub_gas_url';

/**
 * 之後如果幫綜合資料庫也部署一個 Apps Script／試算表，
 * 把網址填在這裡（或在「⚙️ 同步設定」裡貼上），
 * 就能讓教師檔案跨裝置同步，做法跟國小／高中資料庫一致。
 * 留空 = 本機模式，資料只存在這台裝置的瀏覽器裡。
 */
const DEFAULT_GAS_URL = '';
const Backend = { gasUrl: '', cache: null, cloudReady: false };

async function initBackend(){
  Backend.gasUrl = localStorage.getItem(GAS_URL_KEY) || DEFAULT_GAS_URL;
  if(!Backend.gasUrl){ Backend.cloudReady = false; return; }
  try{
    const res = await fetch(Backend.gasUrl + '?action=getAll');
    const json = await res.json();
    if(json && json.ok){
      Backend.cache = json.data || {};
      Backend.cloudReady = true;
    } else {
      throw new Error(json && json.error || '後端回應異常');
    }
  }catch(e){
    Backend.cloudReady = false;
    Backend.cache = {};
    showToast('連線 Google 後端失敗，暫時改用本機資料（不影響操作，但不會跨裝置同步）', 'warn');
  }
}
async function storageGet(key, fallback){
  if(Backend.gasUrl && Backend.cloudReady){
    return Object.prototype.hasOwnProperty.call(Backend.cache, key) ? Backend.cache[key] : fallback;
  }
  try{
    const raw = localStorage.getItem(LOCAL_PREFIX + key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
async function storageSet(key, value){
  if(Backend.gasUrl && Backend.cloudReady){
    Backend.cache[key] = value;
    try{
      await fetch(Backend.gasUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action:'set', key, value })
      });
      return true;
    }catch(e){
      showToast('同步到雲端失敗，請檢查網路連線','warn');
      return false;
    }
  }
  try{
    localStorage.setItem(LOCAL_PREFIX + key, JSON.stringify(value));
    return true;
  }catch(e){
    showToast('本機儲存空間已滿，建議清理部分資料','warn');
    return false;
  }
}

/* ============ shared password (同國小／高中資料庫: 29646498) ============ */
const HUB_PASSWORD = '29646498';
const HUB_UNLOCK_KEY = 'dyzw_hub_unlocked';
const state = { view: 'home', hubUnlocked: sessionStorage.getItem(HUB_UNLOCK_KEY) === '1', teachers: [], teacherSearch: '', teacherTierFilter: '全部', loaded: false, dashboard: {}, rosterTier: null, rosterSearch: '' };

const TIER_OPTIONS = ['國小','國中','高中'];
const TIER_CLASS = { '國小':'el', '國中':'mid', '高中':'hi' };

/* ============ known age-tier databases ============ */
const DATABASES = [
  { key: 'el', tag: 'Elementary', name: '國小資料庫', cls: 'el',
    desc: '日常學生管理、點名、試卷與課程影片，國小老師使用。',
    url: 'https://jesicawork.github.io/Dej-Elementary/',
    gasUrl: 'https://script.google.com/macros/s/AKfycbxZg_6JL5T34382BrIeI5n1E-uB33wp1w-xaw0sN-jXm6IwoY8NvikMRtmHewpcX6Ni/exec',
    gradeOrder: ['G1','G2','G3','G4','G5','G6'],
    active: true },
  { key: 'mid', tag: 'Middle School', name: '國中資料庫', cls: 'mid',
    desc: '功能規劃與國小／高中一致，建議以高中版為模板建立。',
    url: '', gasUrl: '', gradeOrder: [], active: false },
  { key: 'hi', tag: 'High School', name: '高中資料庫', cls: 'hi',
    desc: '日常學生管理、點名、試卷與課程影片，高中老師使用。',
    url: 'https://jesicawork.github.io/Dayangwb/',
    gasUrl: 'https://script.google.com/macros/s/AKfycbyAvOsJzamjnyIs1_FlytDiUkm5TaG4rpb_7BXBUSXOsgUbxxyiV3ycPzKEuxU3pVaJiA/exec',
    gradeOrder: ['高一','高二','高三','專一','專二','專三','專四','專五'],
    active: true }
];

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function genId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function showToast(msg, type){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.style.cssText = 'background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);max-width:320px;';
  if(type === 'warn') el.style.background = '#B4562C';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=> el.remove(), 3600);
}
function todayLabel(){
  const d = new Date();
  const week = ['日','一','二','三','四','五','六'];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${week[d.getDay()]}）`;
}
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}
function csvField(v){
  const s = String(v==null?'':v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function downloadCsv(filename, csvBody){
  const csv = '\uFEFF' + csvBody;
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

  document.querySelectorAll('.tab-btn').forEach(b=>{

  });
  const c = document.getElementById('content');
  if(!state.loaded){
    c.innerHTML = `<div class="empty-state"><span class="ic">⏳</span>資料載入中…</div>`;
    return;
  }
  if(state.view === 'home') c.innerHTML = renderHome();
  else if(state.view === 'hub') c.innerHTML = renderHub();
  else if(state.view === 'teachers') c.innerHTML = state.hubUnlocked ? renderTeachers() : renderLockScreen('teachers');
  else if(state.view === 'dashboard') {
    c.innerHTML = state.hubUnlocked ? renderDashboard() : renderLockScreen('dashboard');
    if(state.hubUnlocked && state._prevView !== 'dashboard' && state._prevView !== 'roster'){
      refreshDashboard();
    }
  }
  else if(state.view === 'roster') c.innerHTML = state.hubUnlocked ? renderTierRoster() : renderLockScreen('dashboard');
  state._prevView = state.view;
  bindEvents();
}

async function fetchTierSummary(gasUrl){
  const res = await fetch(gasUrl + '?action=getAll');
  const json = await res.json();
  if(!json || !json.ok) throw new Error((json && json.error) || '後端回應異常');
  const data = json.data || {};
  const students = data.students || [];
  const counts = { '在班':0, '新生':0, '退班':0 };
  students.forEach(s=>{
    const status = s.enrollStatus || '在班';
    if(Object.prototype.hasOwnProperty.call(counts, status)) counts[status]++;
  });
  return { totalStudents: students.length, counts, students, fetchedAt: new Date().toISOString() };
}

async function refreshDashboard(){
  const activeDbs = DATABASES.filter(db => db.active && db.gasUrl);
  activeDbs.forEach(db => { state.dashboard[db.key] = { status: 'loading' }; });
  render();
  await Promise.all(activeDbs.map(async (db)=>{
    try{
      const summary = await fetchTierSummary(db.gasUrl);
      state.dashboard[db.key] = { status: 'ready', data: summary };
    }catch(e){
      state.dashboard[db.key] = { status: 'error', error: e.message || String(e) };
    }
    render();
  }));
}

function renderDashboardTierCard(db){
  const entry = state.dashboard[db.key];
  if(!db.active || !db.gasUrl){
    return `
      <div class="db-card ${db.cls} disabled">
        <div class="bar"></div>
        <span class="tag">${db.tag}</span>
        <h3>${db.name}</h3>
        <span class="status-badge off">尚未建置，無法統計</span>
      </div>
    `;
  }
  if(!entry || entry.status === 'loading'){
    return `
      <div class="db-card ${db.cls}">
        <div class="bar"></div>
        <span class="tag">${db.tag}</span>
        <h3>${db.name}</h3>
        <p style="color:var(--ink-soft);font-size:13px;">讀取中…</p>
      </div>
    `;
  }
  if(entry.status === 'error'){
    return `
      <div class="db-card ${db.cls}">
        <div class="bar"></div>
        <span class="tag">${db.tag}</span>
        <h3>${db.name}</h3>
        <span class="status-badge off" style="background:#F3E4E2;color:var(--danger);">連線失敗</span>
        <p style="font-size:12px;color:var(--ink-soft);line-height:1.6;">${escapeHtml(entry.error)}<br>請確認 Apps Script 部署設定為「任何人都可以存取」。</p>
      </div>
    `;
  }
  const d = entry.data;
  return `
    <button class="db-card ${db.cls}" data-open-roster="${db.key}" style="cursor:pointer;text-align:left;font-family:inherit;">
      <div class="bar"></div>
      <span class="tag">${db.tag}</span>
      <h3>${db.name}</h3>
      <div style="display:flex; gap:14px; flex-wrap:wrap; margin-top:2px;">
        ${ENROLL_COUNT_KEYS.map(k=>`
          <div>
            <div style="font-family:'Noto Serif TC',serif;font-weight:900;font-size:22px;color:var(--purple-deep);">${d.counts[k]}</div>
            <div style="font-size:11.5px;color:var(--ink-soft);">${k}</div>
          </div>
        `).join('')}
      </div>
      <div class="enter" style="margin-top:6px;">查看完整學生名單 →</div>
    </button>
  `;
}

function renderDashboard(){
  const activeDbs = DATABASES.filter(db => db.active && db.gasUrl);
  const readyEntries = activeDbs.map(db => state.dashboard[db.key]).filter(e => e && e.status === 'ready');
  const totals = { 在班:0, 新生:0, 退班:0, students:0 };
  readyEntries.forEach(e=>{
    ENROLL_COUNT_KEYS.forEach(k=> totals[k] += e.data.counts[k]);
    totals.students += e.data.totalStudents;
  });
  return `
    <div class="topbar">
      <div><p class="eyebrow">CROSS-TIER DASHBOARD</p><h2 class="page-title">跨年齡層儀表板</h2></div>
      <div style="display:flex; gap:8px;">
        <button class="btn ghost small" id="refresh-dashboard-btn">🔄 重新整理</button>
        <button class="btn ghost small" id="lock-hub-btn">🔒 鎖定</button>
      </div>
    </div>

    <div class="section-label">跨年齡層總覽</div>
    <div class="stat-row" style="grid-template-columns:repeat(3,1fr);max-width:100%;">
      ${ENROLL_COUNT_KEYS.map(k=>`
        <div class="stat-card"><div class="stat-num">${totals[k]}</div><div class="stat-label">全體${k}人數</div></div>
      `).join('')}
    </div>
    <p class="helper-note" style="margin-top:-4px;">學生總數：${totals.students} 位（僅計入已連線成功的資料庫）</p>

    <div class="section-label" style="margin-top:22px;">各年齡層資料庫</div>
    <div class="grid">
      ${DATABASES.map(db => renderDashboardTierCard(db)).join('')}
    </div>

    <p class="helper-note">💡 點選任一年齡層卡片可以看到該年齡層完整、依年級排序的學生名單。這裡的數字是即時向國小／高中資料庫的 Apps Script 後端要來的（用現有的 <code>?action=getAll</code> 端點），不會另外存一份在綜合資料庫裡；每次打開這頁或按「重新整理」都會拿到最新資料。國中資料庫建置好、有 Apps Script 網址之後，只要把網址填進程式碼 DATABASES 清單裡 mid 那一筆的 gasUrl，這裡就會自動一起統計。</p>
  `;
}

/* ============ TIER ROSTER (依年級排序的完整學生名單) ============ */
function renderTierRoster(){
  const db = DATABASES.find(d => d.key === state.rosterTier);
  if(!db){
    return `<div class="empty-state"><span class="ic">🧑‍🎓</span>找不到這個年齡層。</div>`;
  }
  const entry = state.dashboard[db.key];
  const backBtn = `<button class="btn ghost small" id="back-to-dashboard-btn">← 回儀表板</button>`;
  if(!entry || entry.status !== 'ready'){
    return `
      <div class="topbar">
        <div>${backBtn}<h2 class="page-title" style="margin-top:10px;">${db.name}學生名單</h2></div>
      </div>
      <p class="helper-note">${entry && entry.status === 'error' ? '資料連線失敗，請先回儀表板重新整理一次。' : '讀取中…'}</p>
    `;
  }
  const students = entry.data.students || [];
  const q = (state.rosterSearch || '').trim().toLowerCase();
  const filtered = q ? students.filter(s => (s.zh||'').toLowerCase().includes(q) || (s.en||'').toLowerCase().includes(q)) : students;
  const order = db.gradeOrder || [];
  const groups = order.map(g => ({ label: g, list: filtered.filter(s => s.grade === g) })).filter(g => g.list.length);
  const otherGrades = [...new Set(filtered.map(s => s.grade || '未分類').filter(g => !order.includes(g)))];
  otherGrades.forEach(g => groups.push({ label: g, list: filtered.filter(s => (s.grade || '未分類') === g) }));

  return `
    <div class="topbar">
      <div>
        ${backBtn}
        <h2 class="page-title" style="margin-top:10px;">${db.name}學生名單</h2>
      </div>
      <div style="font-size:13px;color:var(--ink-soft);align-self:flex-end;">共 ${filtered.length} 位${q ? `（符合搜尋，總數 ${students.length} 位）` : ''}</div>
    </div>
    <div class="toolbar">
      <input type="text" id="roster-search" placeholder="搜尋姓名…" value="${escapeHtml(state.rosterSearch||'')}">
    </div>
    ${groups.length ? groups.map(grp => `
      <div style="margin-top:20px;">
        <div class="section-label">${escapeHtml(grp.label)}（${grp.list.length} 位）</div>
        <div class="teacher-card-grid">
          ${grp.list.map(s => `
            <div class="teacher-card" style="cursor:default;">
              <div class="tc-top">
                <div class="tc-name">${escapeHtml(s.zh||'（未填姓名）')}${s.en ? ` <span style="font-weight:400;font-size:13px;color:var(--ink-soft);">${escapeHtml(s.en)}</span>` : ''}</div>
              </div>
              <div class="tc-meta">${escapeHtml(s.school||'')}</div>
              <span class="tier-chip ${TIER_CLASS[db.key === 'el' ? '國小' : db.key === 'hi' ? '高中' : '國中'] || 'el'}" style="width:fit-content;">${escapeHtml(s.enrollStatus||'在班')}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('') : `<div class="empty-state"><span class="ic">🧑‍🎓</span>沒有符合條件的學生。</div>`}
  `;
}


/* ============ events ============ */
function bindEvents(){
  document.querySelectorAll('[data-goto]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.view = btn.dataset.goto; render(); });
  });

  const pwInput = document.getElementById('hub-password-input');
  const pwSubmit = document.getElementById('hub-password-submit');
  if(pwInput && pwSubmit){
    const tryUnlock = ()=>{
      if(pwInput.value === HUB_PASSWORD){
        state.hubUnlocked = true;
        sessionStorage.setItem(HUB_UNLOCK_KEY, '1');
        render();
      } else {
        const err = document.getElementById('hub-password-error');
        if(err) err.classList.add('show');
        pwInput.value = '';
        pwInput.focus();
      }
    };
    pwSubmit.addEventListener('click', tryUnlock);
    pwInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') tryUnlock(); });
    pwInput.focus();
  }

  const lockBtn = document.getElementById('lock-hub-btn');
  if(lockBtn) lockBtn.addEventListener('click', ()=>{
    state.hubUnlocked = false;
    sessionStorage.removeItem(HUB_UNLOCK_KEY);
    render();
    showToast('已重新鎖定');
  });

  const refreshDashboardBtn = document.getElementById('refresh-dashboard-btn');
  if(refreshDashboardBtn) refreshDashboardBtn.addEventListener('click', refreshDashboard);
  document.querySelectorAll('[data-open-roster]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.rosterTier = btn.dataset.openRoster;
      state.rosterSearch = '';
      state.view = 'roster';
      render();
    });
  });
  const backToDashboardBtn = document.getElementById('back-to-dashboard-btn');
  if(backToDashboardBtn) backToDashboardBtn.addEventListener('click', ()=>{
    state.view = 'dashboard';
    render();
  });
  const rosterSearchInput = document.getElementById('roster-search');
  if(rosterSearchInput) rosterSearchInput.addEventListener('input', (e)=>{
    state.rosterSearch = e.target.value;
    render();
    const el = document.getElementById('roster-search');
    if(el){ el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
  });

  // teachers
  const addTeacherBtn = document.getElementById('add-teacher-btn');
  if(addTeacherBtn) addTeacherBtn.addEventListener('click', ()=> openTeacherModal());
  const openHubSettingsBtn = document.getElementById('open-hub-settings');
  if(openHubSettingsBtn) openHubSettingsBtn.addEventListener('click', openHubSettingsModal);
  const exportTeachersBtn = document.getElementById('export-teachers-csv-btn');
  if(exportTeachersBtn) exportTeachersBtn.addEventListener('click', exportTeachersCsv);
  const teacherSearchInput = document.getElementById('teacher-search');
  if(teacherSearchInput) teacherSearchInput.addEventListener('input', (e)=>{
    state.teacherSearch = e.target.value;
    render();
    const el = document.getElementById('teacher-search');
    if(el){ el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
  });
  const teacherTierFilterSelect = document.getElementById('teacher-tier-filter');
  if(teacherTierFilterSelect) teacherTierFilterSelect.addEventListener('change', (e)=>{
    state.teacherTierFilter = e.target.value;
    render();
  });
  document.querySelectorAll('[data-open-teacher]').forEach(card=>{
    card.addEventListener('click', ()=> openTeacherModal(card.dataset.openTeacher));
    card.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); card.click(); } });
  });
}

/* ============ init ============ */
(async function init(){
  render();
  await loadAll();
  render();
})();
</script>
